            foreach ($TaskCandidateSource in $TaskCandidateSources) {
              if ([string]::IsNullOrWhiteSpace($TaskCandidateSource)) { throw 'REMOTE_NODE_RUNTIME_SELECTION_FAILURE' }
              [void]$TaskUniqueSources.Add([IO.Path]::GetFullPath($TaskCandidateSource))
            }
            if ($TaskUniqueSources.Count -lt 1 -or -not $TaskUniqueSources.Contains($TaskExpectedNode)) { throw 'REMOTE_NODE_RUNTIME_SELECTION_FAILURE' }
            return [pscustomobject]@{ SelectedNode = $TaskExpectedNode; UniqueCandidateCount = $TaskUniqueSources.Count; SelectedNodeCount = 1 }
          }
          function Assert-TaskNodeIdentity {
            param([string]$TaskNodeHash, [string]$TaskNodeVersion, [string]$TaskNodeArchitecture)
            if ($TaskNodeHash -cne '780f44f2c53c108bae261ada21a525b4bfe733c020ac85e41bfe94479090ac9b' -or
                $TaskNodeVersion -cne 'v22.22.3' -or $TaskNodeArchitecture -cne 'x64') { throw 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' }
          }
          function Assert-TaskOrdinaryFile {
            param([string]$TaskFilePath)
            $TaskFileItem = Get-Item -LiteralPath $TaskFilePath -Force -ErrorAction Stop
            if ($TaskFileItem.PSIsContainer -or ($TaskFileItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'REMOTE_NODE_RUNTIME_SELECTION_FAILURE' }
            $TaskAncestor = $TaskFileItem.Directory
            while ($null -ne $TaskAncestor) {
              if (($TaskAncestor.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'REMOTE_NODE_RUNTIME_SELECTION_FAILURE' }
              $TaskAncestor = $TaskAncestor.Parent
            }
          }
          try {
            $TaskNodeCandidates = @(Get-Command node.exe -CommandType Application -All -ErrorAction Stop)
            $TaskCandidateSources = @($TaskNodeCandidates | ForEach-Object { $_.Source })
            $TaskNodeSelection = Resolve-TaskNodeCandidate -TaskCandidateSources $TaskCandidateSources -TaskToolCache $env:RUNNER_TOOL_CACHE
            $TaskSelectedNode = $TaskNodeSelection.SelectedNode
            Assert-TaskOrdinaryFile -TaskFilePath $TaskSelectedNode
            $TaskSelectedNodeHash = (Get-FileHash -LiteralPath $TaskSelectedNode -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            Assert-TaskNodeIdentity -TaskNodeHash $TaskSelectedNodeHash -TaskNodeVersion 'v22.22.3' -TaskNodeArchitecture 'x64'
            $TaskVersionOutput = @(& $TaskSelectedNode --version 2>$null)
            $TaskVersionExitCode = $LASTEXITCODE
            if ($TaskVersionExitCode -ne 0 -or $TaskVersionOutput.Count -ne 1) { throw 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' }
            $TaskArchitectureOutput = @(& $TaskSelectedNode -e 'console.log(process.arch)' 2>$null)
            $TaskArchitectureExitCode = $LASTEXITCODE
            if ($TaskArchitectureExitCode -ne 0 -or $TaskArchitectureOutput.Count -ne 1) { throw 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' }
            Assert-TaskNodeIdentity -TaskNodeHash $TaskSelectedNodeHash -TaskNodeVersion $TaskVersionOutput[0] -TaskNodeArchitecture $TaskArchitectureOutput[0]
            $TaskIdentityExpression = 'console.log(JSON.stringify({version:process.version,architecture:process.arch,openssl:process.versions.openssl,fips:require("node:crypto").getFips(),execPath:process.execPath}))'
            $TaskIdentityOutput = @(& $TaskSelectedNode -e $TaskIdentityExpression 2>$null)
            $TaskIdentityExitCode = $LASTEXITCODE
            if ($TaskIdentityExitCode -ne 0 -or $TaskIdentityOutput.Count -ne 1 -or $TaskIdentityOutput[0].Length -gt 4096) { throw 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' }
            $TaskIdentity = $TaskIdentityOutput[0] | ConvertFrom-Json -ErrorAction Stop
            Assert-TaskNodeIdentity -TaskNodeHash $TaskSelectedNodeHash -TaskNodeVersion $TaskIdentity.version -TaskNodeArchitecture $TaskIdentity.architecture
            if ([IO.Path]::GetFullPath($TaskIdentity.execPath) -ine $TaskSelectedNode -or
                $TaskIdentity.openssl -cnotmatch '^[0-9A-Za-z.+-]{1,40}$' -or $TaskIdentity.fips -notin @(0,1)) { throw 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' }
            Assert-TaskOrdinaryFile -TaskFilePath $TaskScriptPath
            $TaskNodeQualification = [ordered]@{
              schemaVersion = 1; classification = 'REMOTE_NODE_RUNTIME_QUALIFIED'
              candidateRecordCount = $TaskNodeCandidates.Count; uniqueCandidateCount = $TaskNodeSelection.UniqueCandidateCount
              selectedNodeCount = $TaskNodeSelection.SelectedNodeCount; executableRole = 'SETUP_NODE_TOOLCACHE'
              version = $TaskIdentity.version; architecture = $TaskIdentity.architecture
              openssl = $TaskIdentity.openssl; fips = $TaskIdentity.fips; executableSHA256 = $TaskSelectedNodeHash
            }
            Write-Output ('R4_NODE_QUALIFICATION=' + ($TaskNodeQualification | ConvertTo-Json -Compress))
          } catch {
            $TaskNodeFailureCategory = if ($_.Exception.Message -ceq 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH') { 'REMOTE_NODE_RUNTIME_IDENTITY_MISMATCH' } else { 'REMOTE_NODE_RUNTIME_SELECTION_FAILURE' }
            Write-Output $TaskNodeFailureCategory
            exit 1
          }
          & $TaskSelectedNode $TaskScriptPath
          $TaskAcquisitionExitCode = $LASTEXITCODE
          exit $TaskAcquisitionExitCode
      - name: Preserve sanitized preinstall failure when needed
        if: always()
        timeout-minutes: 5
        env:
          TASK_DOWNLOAD_OUTCOME: ${{ steps.bundle-download.outcome }}
          TASK_TOOL_OUTCOME: ${{ steps.tool-verification.outcome }}
          TASK_VERIFY_OUTCOME: ${{ steps.offline-qualification.outcome }}
        run: |
          $ErrorActionPreference='Stop'
          try {
           $TaskEvidence=Join-Path $env:RUNNER_TEMP 'studyai-r4-control\evidence'
           $TaskTarget=Join-Path $TaskEvidence 'bundle-qualification-report.json'
           if (-not (Test-Path -LiteralPath $TaskTarget -PathType Leaf)) {
            if (-not (Test-Path -LiteralPath $TaskEvidence -PathType Container)) {[IO.Directory]::CreateDirectory($TaskEvidence)|Out-Null}
            $TaskFallback=[ordered]@{schemaVersion=1;scope='REMOTE_R4_BUNDLE_PREINSTALL_FAILURE';workflowCommit=$env:GITHUB_SHA;workflowRunId=$env:GITHUB_RUN_ID;classification='REMOTE_DEPENDENCY_BUNDLE_TRANSFER_INTEGRITY_FAILURE';failureCategory='PREINSTALL_STEP_FAILED';artifactDownloadOutcome=$env:TASK_DOWNLOAD_OUTCOME;toolOutcome=$env:TASK_TOOL_OUTCOME;verificationOutcome=$env:TASK_VERIFY_OUTCOME;offlineAttempts=0;offlineExitCode=$null;rawOutputForwarded=0;complete=$true}
            $TaskJson=$TaskFallback|ConvertTo-Json -Compress
            [IO.File]::WriteAllText($TaskTarget,$TaskJson+[char]10,[Text.UTF8Encoding]::new($false))
            Write-Output ('BUNDLE_PREINSTALL_REPORT='+$TaskJson)
           }
          } catch {Write-Output 'BUNDLE_FAILURE_REPORTING_BLOCKED';exit 1}
      - name: Upload small qualification evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r4-bundle-qualification-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/studyai-r4-control/evidence/bundle-qualification-report.json
          overwrite: false
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
