name: StudyAI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Get pnpm Store Directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify Workspace Linting
      run: pnpm lint

    - name: Run Drizzle Database Generate Check
      run: pnpm db:generate

    - name: Compile and Typecheck All Packages
      run: |
        pnpm --filter @studyai/types exec tsc --noEmit
        pnpm --filter @studyai/database exec tsc --noEmit
        pnpm --filter @studyai/api exec tsc --noEmit
        pnpm --filter @studyai/web exec tsc --noEmit

    - name: Run Unit Tests
      run: pnpm test

    - name: Test Production Standalone Build
      run: pnpm run build
