name: StudyAI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector@sha256:d3a9d8ac27bb7e05e333ef25b634d2625adaa85336ab729954b9e94859bf6fa7
        env:
          POSTGRES_DB: studyai_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studyai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/studyai_test
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/studyai_test
      DRIZZLE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/studyai_test
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      FRONTEND_URL: http://127.0.0.1:3000
      STORAGE_PATH: ${{ runner.temp }}/studyai-uploads

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Get pnpm Store Directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Disposable Test Secrets
      shell: bash
      run: |
        node -e "const { randomBytes } = require('node:crypto'); for (const name of ['JWT_SECRET', 'JWT_REFRESH_SECRET', 'STRIPE_SECRET_KEY']) process.stdout.write(name + '=' + randomBytes(48).toString('hex') + '\n')" >> "$GITHUB_ENV"
        mkdir -p "$STORAGE_PATH"

    - name: Scan Tracked Content for Committed Secrets
      run: pnpm security:scan

    - name: Verify Workspace Linting
      run: pnpm lint

    - name: Check Drizzle Migration Metadata
      run: pnpm --filter @studyai/database db:check

    - name: Apply Drizzle Migrations to Isolated CI Database
      run: pnpm --filter @studyai/database db:migrate

    - name: Compile and Typecheck All Packages
      run: |
        pnpm --filter @studyai/types exec tsc --noEmit
        pnpm --filter @studyai/database exec tsc --noEmit
        pnpm --filter @studyai/api exec tsc --noEmit
        pnpm --filter @studyai/web exec tsc --noEmit

    - name: Run Unit Tests
      run: pnpm test

    - name: Run API Integration Tests
      run: pnpm --filter @studyai/api test:integration

    - name: Verify Upload Backup and Restore Workflow
      run: pnpm ops:test-upload-recovery

    - name: Test Production Standalone Build
      run: pnpm run build
