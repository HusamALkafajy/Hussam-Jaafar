version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: studyai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: studyai
      POSTGRES_PASSWORD: studyai_dev_password
      POSTGRES_DB: studyai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: ankane/pgvector:latest
    container_name: studyai-postgres-test
    restart: on-failure
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: studyai_test
      POSTGRES_PASSWORD: studyai_test_password
      POSTGRES_DB: studyai_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyai_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
